[project]
name = "hsp"
version = "0.1.0"
description = "Underwriting DSL Agent — agentic code generation for regulated insurance decisioning (synthetic)"
requires-python = ">=3.11"
dependencies = [
    "jsonschema==4.25.1",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "ruff==0.13.2",
]

[project.scripts]
hsp = "hsp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hsp"]

[tool.hatch.build.targets.wheel.force-include]
"corpus" = "corpus"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
